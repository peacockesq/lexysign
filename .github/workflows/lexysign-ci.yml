name: LexySign CI

on:
  pull_request:
    branches: [staging, main, lexysign-hetzner-prep]
    paths:
      - 'apps/OpenSign/**'
      - 'apps/OpenSignServer/**'
      - 'deploy/lexysign/**'
      - '.github/workflows/lexysign-*.yml'
      - 'scripts/ci/**'
      - 'tests/parity/**'
  push:
    branches: [lexysign-hetzner-prep, staging, main]
    paths:
      - 'apps/OpenSign/**'
      - 'apps/OpenSignServer/**'
      - 'deploy/lexysign/**'
      - '.github/workflows/lexysign-*.yml'
      - 'scripts/ci/**'
      - 'tests/parity/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: lexysign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main for scan base
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server syntax checks
        run: |
          set -euo pipefail
          node --check apps/OpenSignServer/Utils.js
          node --check apps/OpenSignServer/index.js
          node --check apps/OpenSignServer/cloud/main.js
          node --check apps/OpenSignServer/cloud/customRoute/billing.js
          node --check apps/OpenSignServer/cloud/customRoute/customApp.js
          node --check apps/OpenSignServer/billing/stripeClient.js
          node --check apps/OpenSignServer/billing/entitlements.js
          node --check apps/OpenSignServer/cloud/parsefunction/loginWithSupabase.js
          node --check apps/OpenSignServer/cloud/customRoute/docxtopdf.js
          node --check apps/OpenSignServer/cloud/customRoute/deleteAccount/deleteFileUrl.js
          node --check apps/OpenSignServer/cloud/parsefunction/AddAdmin.js
          node --check apps/OpenSignServer/spec/lexysignContracts.test.js
      - name: Secret scan guard tests
        run: python3 scripts/ci/secret_scan_test.py
      - name: Secret value scan on changed files
        run: |
          python3 scripts/ci/secret_scan.py \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before || '' }}" \
            --head HEAD

  server-node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSignServer/package-lock.json
      - name: Install server dependencies
        working-directory: apps/OpenSignServer
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Node contract tests
        working-directory: apps/OpenSignServer
        run: npm run test:node

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSign/package-lock.json
      - name: Install client dependencies
        working-directory: apps/OpenSign
        run: npm ci --no-audit --no-fund
      - name: Node contract tests
        working-directory: apps/OpenSign
        run: npm run test:node
      - name: Vitest
        working-directory: apps/OpenSign
        run: npm test

  parity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSign/package-lock.json
      - name: Install client lockfile deps for PDF regressions
        working-directory: apps/OpenSign
        run: npm ci --omit=dev --no-audit --no-fund --ignore-scripts
      - name: Install poppler-utils for PDF text assertions
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils
      - name: Run parity tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d tests/parity ]]; then
            echo "tests/parity is required; refusing to skip." >&2
            exit 1
          fi
          shopt -s nullglob
          files=(tests/parity/*.test.mjs)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no tests/parity/*.test.mjs; refusing to skip." >&2
            exit 1
          fi
          node --test "${files[@]}"

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            dockerfile: apps/OpenSign/Dockerfile.lexysign
          - name: server
            dockerfile: apps/OpenSignServer/Dockerfile.lexysign
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build LexySign ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: ghcr.io/peacockesq/lexysign-${{ matrix.name }}:ci-${{ github.sha }}
          build-args: |
            REACT_APP_SERVERURL=https://sign-ci.invalid/api/app
            REACT_APP_APPID=opensign
            REACT_APP_FORCE_DRAWN_SIGNATURES=false
            VITE_SUPABASE_URL=https://ci.invalid
            VITE_SUPABASE_ANON_KEY=ci-placeholder
